<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prontuário do Paciente</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="pagina">

    <h1>Prontuário do Paciente</h1>

    <div class="resultado-prontuario">

      <div class="item">

        <strong>Dados do Paciente</strong>

        <p><b>Nome:</b> <span id="nome"></span></p>

        <p><b>Nome da Mãe:</b> <span id="mae"></span></p>

        <p><b>Data de Nascimento:</b> <span id="data"></span></p>

        <p><b>CPF:</b> <span id="cpf"></span></p>

        <p><b>RG:</b> <span id="rg"></span></p>

        <p><b>Número do Prontuário:</b> <span id="prontuario"></span></p>

      </div>

      <div class="botoes-final">

        <button
          class="btn-voltar-pesquisa"
          onclick="window.location.href='index.html'"
>
          Voltar para Pesquisa
        </button>

        <button
          class="btn-gerar-prontuario"
          onclick="window.print()"
        >
          Imprimir
        </button>

      </div>

    </div>

  </div>

  <script>

    document.getElementById("nome").textContent =
      sessionStorage.getItem("nomePaciente") || "";

    document.getElementById("mae").textContent =
      sessionStorage.getItem("nomeMae") || "";

    document.getElementById("data").textContent =
      sessionStorage.getItem("dataNascimento") || "";

    document.getElementById("cpf").textContent =
      sessionStorage.getItem("cpf") || "";

    document.getElementById("rg").textContent =
      sessionStorage.getItem("rg") || "";

    document.getElementById("prontuario").textContent =
      sessionStorage.getItem("numeroProntuario") || "";

  </script>

</body>

</html>
